
name: Build AI TimeTable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project
          

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Build APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-TimeTable-APK
          path: AITimeTable/app/build/outputs/apk/debug/app-debug.apk
          
